name: Dependency lock and Go format
on:
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/package.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize Go source and dependency hashes
        working-directory: backend
        run: |
          gofmt -w cmd internal
          go mod tidy
      - name: Lock frontend dependencies
        working-directory: frontend
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit normalized sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: format Go sources and lock dependencies"
            git push origin HEAD:main
          fi
