name: Deploy FreelanceOps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freelanceops-production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build images on GitHub runner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build application images
        run: |
          set -euo pipefail
          docker compose -f compose.yaml build
          docker save freelanceops-api:local freelanceops-web:local | gzip -1 > images.tar.gz
      - name: Publish images for deployment
        uses: actions/upload-artifact@v4
        with:
          name: freelanceops-images
          path: images.tar.gz
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy on self-hosted runner
    needs: build
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    env:
      DEPLOY_DIR: /opt/apps/freelanceops
      COMPOSE_PROJECT_NAME: freelanceops
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download prebuilt images
        uses: actions/download-artifact@v4
        with:
          name: freelanceops-images
          path: ${{ runner.temp }}/freelanceops-images
      - name: Check runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          command -v docker
          docker info >/dev/null
          docker compose version
          test -f compose.yaml
          docker network inspect app-net >/dev/null
          mkdir -p "$DEPLOY_DIR"
          test -w "$DEPLOY_DIR"
      - name: Load verified image artifact
        shell: bash
        run: |
          set -euo pipefail
          gzip -t "${{ runner.temp }}/freelanceops-images/images.tar.gz"
          gzip -dc "${{ runner.temp }}/freelanceops-images/images.tar.gz" | docker load
      - name: Copy deployment files without overwriting secrets
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='./.git' --exclude='./.github' --exclude='./.env' --exclude='./.env.*' --exclude='./data' --exclude='./images.tar.gz' \
            -cf - -C "$GITHUB_WORKSPACE" . | tar -xf - -C "$DEPLOY_DIR"
          cd "$DEPLOY_DIR"
          docker compose -f compose.yaml config --quiet
      - name: Start prebuilt containers
        shell: bash
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          docker compose -f compose.yaml up -d --no-build --remove-orphans
      - name: Check container health
        shell: bash
        run: |
          set -euo pipefail
          for name in freelanceops-api freelanceops-web; do
            echo "Checking health: $name"
            healthy=false
            for attempt in $(seq 1 45); do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$name" 2>/dev/null || true)"
              if [ "$status" = healthy ]; then healthy=true; break; fi
              if [ "$status" = unhealthy ] || [ "$status" = exited ]; then
                echo "::error::$name is $status"
                docker logs --tail 80 "$name" || true
                exit 1
              fi
              sleep 4
            done
            if [ "$healthy" != true ]; then
              echo "::error::$name did not become healthy in time"
              docker logs --tail 80 "$name" || true
              exit 1
            fi
          done
          docker compose -f "$DEPLOY_DIR/compose.yaml" ps
          echo "Deployed commit: $GITHUB_SHA"
