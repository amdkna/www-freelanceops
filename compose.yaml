name: freelanceops
services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: freelanceops-web:local
    container_name: freelanceops-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: freelanceops-api:local
    container_name: freelanceops-api
    restart: unless-stopped
    environment:
      PORT: "8080"
    expose:
      - "8080"
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  app-net:
    external: true
    name: app-net
